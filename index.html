<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Ah新的朋友圈</title>
<meta name="description" content="记录生活中的每一刻">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#191919" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="朋友圈">
<meta name="format-detection" content="telephone=no">
<meta property="og:title" content="Ah新的朋友圈">
<meta property="og:description" content="记录生活中的每一刻">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://memos.ahxin.cn" crossorigin>
<link rel="preload" as="image" href="/assets/cover.jpg">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" href="/assets/pyqlogo.png">
<link rel="apple-touch-icon" href="/assets/pyqlogo.png">
<link rel="stylesheet" href="/css/styles.css?v=20261108m">
<script>
(function () {
  try {
    var mode = localStorage.getItem('pyq-theme') || 'auto';
    var dark = mode === 'dark' || (mode === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.dataset.theme = dark ? 'dark' : 'light';
  } catch (e) {
    document.documentElement.dataset.theme = 'light';
  }
})();
</script>
</head>
<body>

<div class="app" id="app">

  <header class="nav" id="nav">
    <div class="nav-inner">
      <button class="nav-btn" id="backBtn" hidden aria-label="返回">
        <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="14.5 5 7.5 12 14.5 19"></polyline></svg>
      </button>
      <button class="nav-btn" id="themeBtn" aria-label="切换深色模式">
        <svg class="icon-sun" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="4.1"></circle>
          <path d="M12 3.2v2.1M12 18.7v2.1M3.2 12h2.1M18.7 12h2.1M6.1 6.1l1.5 1.5M16.4 16.4l1.5 1.5M6.1 17.9l1.5-1.5M16.4 7.6l1.5-1.5"></path>
        </svg>
        <svg class="icon-moon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20.1 14.3A8.5 8.5 0 0 1 9.7 3.9a8.7 8.7 0 1 0 10.4 10.4z"></path>
          <path d="M16.6 3.6l.5 1.4 1.4.5-1.4.5-.5 1.4-.5-1.4-1.4-.5 1.4-.5z" fill="currentColor" stroke="none"></path>
        </svg>
      </button>
      <h1 class="nav-title"><a class="nav-title-link" id="navTitle" href="./" title="回到首页">朋友圈</a></h1>
      <button class="nav-btn" id="shareBtn" hidden aria-label="分享">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 14.5V3.8"></path><path d="M8 7.2 12 3.2l4 4"></path><path d="M5.5 11v7.5A2.5 2.5 0 0 0 8 21h8a2.5 2.5 0 0 0 2.5-2.5V11"></path></svg>
      </button>
      <a class="nav-btn" id="postBtn" href="https://memos.ahxin.cn" target="_blank" rel="noopener" aria-label="发表">
        <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2.9" y="7.3" width="18.2" height="12.9" rx="3.4"></rect>
          <path d="M8.9 7.3 10.3 4.7h3.4l1.4 2.6"></path>
          <circle cx="12" cy="13.7" r="3.3"></circle>
        </svg>
      </a>
    </div>
  </header>

  <section class="cover" id="cover">
    <img class="cover-img" id="coverImg" alt="" decoding="async">
    <div class="cover-mask"></div>
    <div class="cover-user">
      <span class="cover-name" id="coverName"></span>
      <img class="cover-avatar" id="coverAvatar" alt="" decoding="async">
    </div>
  </section>

  <main class="feed" id="feed" aria-live="polite">
    <div class="skeleton">
      <div class="sk sk-avatar"></div>
      <div>
        <div class="sk sk-line" style="width:30%"></div>
        <div class="sk sk-line" style="width:88%"></div>
        <div class="sk sk-line" style="width:64%"></div>
        <div class="sk sk-block"></div>
      </div>
    </div>
    <div class="skeleton">
      <div class="sk sk-avatar"></div>
      <div>
        <div class="sk sk-line" style="width:26%"></div>
        <div class="sk sk-line" style="width:74%"></div>
        <div class="sk sk-line" style="width:52%"></div>
      </div>
    </div>
    <div class="skeleton">
      <div class="sk sk-avatar"></div>
      <div>
        <div class="sk sk-line" style="width:32%"></div>
        <div class="sk sk-line" style="width:82%"></div>
        <div class="sk sk-block"></div>
      </div>
    </div>
  </main>

  <div class="pager" id="pager">
    <div class="spinner" id="spinner" hidden></div>
    <button class="pager-btn" id="moreBtn" hidden>加载更多</button>
    <p class="feed-end" id="feedEnd" hidden>没有更多了</p>
    <button class="retry" id="retryBtn" hidden>加载失败，点击重试</button>
  </div>

  <button class="top-btn" id="topBtn" type="button" aria-label="回到顶部" title="回到顶部">
    <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 19.4V8.6"></path>
      <path d="M6.7 13.2 12 7.9l5.3 5.3"></path>
      <path d="M6.9 4.2h10.2"></path>
    </svg>
  </button>
</div>

<div class="viewer" id="viewer" aria-hidden="true">
  <div class="viewer-stage" id="viewerStage">
    <div class="viewer-track">
      <button class="viewer-arrow viewer-arrow-prev" id="viewerPrev" aria-label="上一张">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 5 8 12 15 19"></polyline></svg>
      </button>
      <img class="viewer-img" id="viewerImg" alt="">
      <button class="viewer-arrow viewer-arrow-next" id="viewerNext" aria-label="下一张">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 5 16 12 9 19"></polyline></svg>
      </button>
    </div>
  </div>
  <button class="viewer-close" id="viewerClose" aria-label="关闭">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg>
  </button>
  <div class="viewer-count" id="viewerCount"></div>
</div>

<div class="toast" id="toast" role="status"></div>

<script type="module" src="/js/app.js?v=20261108m"></script>
</body>
</html>
