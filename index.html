<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Ah新的朋友圈</title>
<meta name="description" content="记录生活中的每一刻">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#191919" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="朋友圈">
<meta name="format-detection" content="telephone=no">
<meta property="og:title" content="Ah新的朋友圈">
<meta property="og:description" content="记录生活中的每一刻">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://memos.ahxin.cn" crossorigin>
<link rel="preload" as="image" href="./assets/cover.jpg">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2307c160'/%3E%3Ccircle cx='16' cy='17' r='6' fill='none' stroke='%23fff' stroke-width='2.4'/%3E%3Crect x='9' y='8' width='6' height='3' rx='1.5' fill='%23fff'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/styles.css?v=20261108a">
<script>
(function () {
  try {
    var mode = localStorage.getItem('pyq-theme') || 'auto';
    var dark = mode === 'dark' || (mode === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.dataset.theme = dark ? 'dark' : 'light';
  } catch (e) {
    document.documentElement.dataset.theme = 'light';
  }
})();
</script>
</head>
<body>

<div class="app" id="app">

  <header class="nav" id="nav">
    <div class="nav-inner">
      <button class="nav-btn" id="themeBtn" aria-label="切换深色模式">
        <svg class="icon-sun" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
          <circle cx="12" cy="12" r="4"></circle>
          <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path>
        </svg>
        <svg class="icon-moon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5z"></path>
        </svg>
      </button>
      <h1 class="nav-title">朋友圈</h1>
      <a class="nav-btn" id="postBtn" href="https://memos.ahxin.cn" target="_blank" rel="noopener" aria-label="发表">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 8.5A2.5 2.5 0 0 1 5.5 6h1.8l1.2-2h6.9l1.2 2h1.9A2.5 2.5 0 0 1 21 8.5v9A2.5 2.5 0 0 1 18.5 20h-13A2.5 2.5 0 0 1 3 17.5z"></path>
          <circle cx="12" cy="12.8" r="3.4"></circle>
        </svg>
      </a>
    </div>
  </header>

  <section class="cover" id="cover">
    <img class="cover-img" id="coverImg" alt="" decoding="async">
    <div class="cover-mask"></div>
    <div class="cover-user">
      <span class="cover-name" id="coverName"></span>
      <img class="cover-avatar" id="coverAvatar" alt="" decoding="async">
    </div>
  </section>

  <main class="feed" id="feed" aria-live="polite"></main>

  <div class="pager" id="pager">
    <div class="spinner" id="spinner" hidden></div>
    <button class="pager-btn" id="moreBtn" hidden>加载更多</button>
    <p class="feed-end" id="feedEnd" hidden>没有更多了</p>
    <button class="retry" id="retryBtn" hidden>加载失败，点击重试</button>
  </div>

  <div class="top-btn" id="topBtn" aria-hidden="true">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="6 15 12 9 18 15"></polyline>
    </svg>
  </div>
</div>

<div class="viewer" id="viewer" aria-hidden="true">
  <div class="viewer-stage" id="viewerStage">
    <div class="viewer-track">
      <button class="viewer-arrow viewer-arrow-prev" id="viewerPrev" aria-label="上一张">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 5 8 12 15 19"></polyline></svg>
      </button>
      <img class="viewer-img" id="viewerImg" alt="">
      <button class="viewer-arrow viewer-arrow-next" id="viewerNext" aria-label="下一张">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 5 16 12 9 19"></polyline></svg>
      </button>
    </div>
  </div>
  <button class="viewer-close" id="viewerClose" aria-label="关闭">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg>
  </button>
  <div class="viewer-count" id="viewerCount"></div>
</div>

<div class="toast" id="toast" role="status"></div>

<script type="module" src="js/app.js?v=20261108a"></script>
</body>
</html>
